services:
  planesign:
    image: ghcr.io/dmod/planesign:latest
    container_name: PlaneSignRuntime
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - ./sign.conf:/planesign/sign.conf
      - ./datafiles:/planesign/datafiles
      - ./sketches:/planesign/sketches
      - ./icons/finance/logos/:/planesign/icons/finance/logos
      - ./icons/lightning:/planesign/icons/lightning
      - ./icons/snow/logos/:/planesign/icons/snow/logos
