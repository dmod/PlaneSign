<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="layout-new.css">
  <link rel="stylesheet" href="plane_button.css">
  <link rel="stylesheet" href="mic_button.css">
  <link rel="stylesheet" href="trackaflight.css">
  <link rel="stylesheet" href="finance.css">
  <link rel="stylesheet" href="snow.css">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script src="themes.js"></script>
  <script src="index.js?v=free-sketch-8"></script>
  <title>Plane Sign New Interface (Beta)</title>
</head>

<body>
  <div id="layout_bar" style="position:fixed;top:10px;right:12px;z-index:1000;display:flex;align-items:center;gap:7px;background:rgba(13,17,23,0.92);border:1px solid #30363d;border-radius:20px;padding:4px 10px;box-shadow:0 1px 4px rgba(0,0,0,0.4);">
    <span style="font-size:12px;color:#8b949e;white-space:nowrap;">Original</span>
    <label style="position:relative;width:40px;height:22px;display:inline-block;">
      <input type="checkbox" id="layout_toggle" onchange="toggle_layout()" style="opacity:0;width:0;height:0;">
      <span style="position:absolute;cursor:pointer;inset:0;background-color:#7bb9c9;border-radius:22px;transition:background-color 0.3s;"></span>
      <style>
        #layout_toggle:checked+span {
          background-color: #30a14e;
        }

        #layout_toggle+span::before {
          content: '';
          position: absolute;
          height: 16px;
          width: 16px;
          left: 3px;
          bottom: 3px;
          background-color: white;
          border-radius: 50%;
          transition: transform 0.3s;
        }

        #layout_toggle:checked+span::before {
          transform: translateX(18px);
        }
      </style>
    </label>
    <span style="font-size:12px;color:#c9d1d9;font-weight:bold;white-space:nowrap;">New Interface (Beta)</span>
    <script>init_layout_toggle();</script>
  </div>

  <div class="command-shell">
    <header class="command-status-bar">
      <div class="command-status-row">
        <div class="command-brand">
          <div class="command-brand-title">Plane Sign</div>
          <div class="command-brand-subtitle">New Interface (Beta)</div>
        </div>
        <div class="command-power">
          <label id="header_switch" class="plane-switch">
            <input id="toggle_switch" type="checkbox">
            <div style="transform: scale(5);">
              <div>
                <svg>
                  <path fill="currentColor" d="M1.55989957,5.41666667 L5.51582215,5.41666667 L4.47015462,0.108333333 L4.47015462,0.108333333 C4.47015462,0.0634601974 4.49708054,0.0249592654 4.5354546,0.00851337035 L4.57707145,0 L5.36229752,0 C5.43359776,0 5.50087375,0.028779451 5.55026392,0.0782711996 L5.59317877,0.134368264 L7.13659662,2.81558333 L8.29565964,2.81666667 C8.53185377,2.81666667 8.72332694,3.01067661 8.72332694,3.25 C8.72332694,3.48932339 8.53185377,3.68333333 8.29565964,3.68333333 L7.63589819,3.68225 L8.63450135,5.41666667 L11.9308317,5.41666667 C12.5213171,5.41666667 13,5.90169152 13,6.5 C13,7.09830848 12.5213171,7.58333333 11.9308317,7.58333333 L8.63450135,7.58333333 L7.63589819,9.31666667 L8.29565964,9.31666667 C8.53185377,9.31666667 8.72332694,9.51067661 8.72332694,9.75 C8.72332694,9.98932339 8.53185377,10.1833333 8.29565964,10.1833333 L7.13659662,10.1833333 L5.59317877,12.8656317 C5.55725264,12.9280353 5.49882018,12.9724157 5.43174295,12.9907056 L5.36229752,13 L4.57707145,13 L4.55610333,12.9978962 C4.51267695,12.9890959 4.48069792,12.9547924 4.47230803,12.9134397 L4.47223088,12.8704208 L5.51582215,7.58333333 L1.55989957,7.58333333 L0.891288881,8.55114605 C0.853775374,8.60544678 0.798421006,8.64327676 0.73629202,8.65879796 L0.672314689,8.66666667 L0.106844414,8.66666667 L0.0715243949,8.66058466 L0.0715243949,8.66058466 C0.0297243066,8.6457608 0.00275502199,8.60729104 0,8.5651586 L0.00593007386,8.52254537 L0.580855011,6.85813984 C0.64492547,6.67265611 0.6577034,6.47392717 0.619193545,6.28316421 L0.580694768,6.14191703 L0.00601851064,4.48064746 C0.00203480725,4.4691314 0,4.45701613 0,4.44481314 C0,4.39994001 0.0269259152,4.36143908 0.0652999725,4.34499318 L0.106916826,4.33647981 L0.672546853,4.33647981 C0.737865848,4.33647981 0.80011301,4.36066329 0.848265401,4.40322477 L0.89131128,4.45169723 L1.55989957,5.41666667 Z">
                  </path>
                </svg>
              </div>
              <span class="street-middle"></span>
              <span class="cloud"></span>
              <span class="cloud two"></span>
            </div>
          </label>
        </div>
        <div class="command-settings">
          <button type="submit" id="optionsbutton" onclick="show_options(); return false;">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="grey" class="bi bi-gear" viewBox="0 0 16 16">
              <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z" />

            </svg>
          </button>
        </div>
      </div>
      <div class="command-brightness-row">
        <label for="brightness_slider">Brightness</label>
        <input id="brightness_slider" type="range" min="0" max="100" step="1" value="100">
      </div>
    </header>

    <main class="command-main">
      <section class="command-left-column">
        <section class="command-group-panel">
          <div class="command-group-header">Planes</div>
          <div class="command-group-grid">
            <div class="command-mode-item">
              <button id="PLANES_ALERT" class="mode_button" onclick="set_mode(this.id)">Default Mode</button>
            </div>
            <div class="command-mode-item">
              <button id="PLANES_CLOSEST" class="mode_button" onclick="set_mode(this.id)">Show Closest</button>
            </div>
            <div class="command-mode-item">
              <button id="PLANES_HIGHEST" class="mode_button" onclick="set_mode(this.id)">Show Highest</button>
            </div>
            <div class="command-mode-item">
              <button id="PLANES_FASTEST" class="mode_button" onclick="set_mode(this.id)">Show Fastest</button>
            </div>
            <div class="command-mode-item">
              <button id="PLANES_SLOWEST" class="mode_button" onclick="set_mode(this.id)">Show Slowest</button>
            </div>
            <div class="command-mode-item">
              <button id="TRACK_A_FLIGHT" class="mode_button" onclick="set_mode(this.id); document.getElementById('track-a-flight_div').hidden = false">Track-A-Flight™</button>
              <div id="track-a-flight_div" hidden>
                <input id="track-a-flight_flight-num-input" autocomplete="off" oninput="this.value=this.value.replace( /[^a-zA-Z0-9]/ , ''); get_possible_autofill_flights(this.value)"></input>
              </div>
            </div>
          </div>
        </section>

        <section class="command-group-panel">
          <div class="command-group-header">Informational</div>
          <div class="command-group-grid">
            <div class="command-mode-item">
              <button id="WEATHER" class="mode_button" onclick="set_mode(this.id)">Weather ❄️</button>
            </div>
            <div class="command-mode-item">
              <button id="TIME_ONLY" class="mode_button" onclick="set_mode(this.id)">Clock Only 🕓</button>
            </div>
            <div class="command-mode-item">
              <button id="SATELLITE" class="mode_button" onclick="set_mode(this.id); document.getElementById('satellite_div').hidden = false">Satellites 🛰️</button>
              <div id="satellite_div" hidden>
                <input type="radio" id="Overhead" name="satellitestyle" onclick="set_satellite_mode(this.value)" value="1" checked="checked">
                <label for="Overhead">Overhead</label>
                <input type="radio" id="ISS" name="satellitestyle" onclick="set_satellite_mode(this.value)" value="2">
                <label for="ISS">ISS</label>
              </div>
            </div>
            <div class="command-mode-item">
              <button id="SNOW" class="mode_button" onclick="set_mode(this.id); get_resorts(); setTimeout(get_saved_resorts, 1000); document.getElementById('snow_div').hidden = false">Slope Conditions 🏂</button>
              <div id="snow_div" style="position: relative;" hidden>
                <div id="tracked_resorts" hidden>
                  <b style="padding-top: 5px;display: block;">Tracked Resorts</b>
                  <hr>
                  <input type="radio" id="Detail" name="snowmode" onclick="set_snow_mode(this.value)" value="1" checked="checked">
                  <label for="Detail">Rotate Detail</label>
                  <input type="radio" id="Overview" name="snowmode" onclick="set_snow_mode(this.value)" value="2">
                  <label for="Overview">Overview</label>
                  <hr>
                  <div id="user_resort_list">
                  </div>
                </div>
                <div id="resort_search" hidden>
                  <input type="text" id="resort_searchbar" autocomplete="off" oninput="get_possible_autofill_resorts(this.value)"></input>
                  <button id="save_resort" onclick="save_current_resort(); set_snow_mode(getElementById('Detail').value)">
                    Save
                  </button>
                </div>
              </div>
            </div>
            <div class="command-mode-item">
              <button id="MOON" class="mode_button" onclick="set_mode(this.id)">Moon 🌘</button>
            </div>
            <div class="command-mode-item">
              <button id="LIGHTNING" class="mode_button" onclick="set_mode(this.id); document.getElementById('lightning_div').hidden = false">Lightning ⛈️</button>
              <div id="lightning_div" hidden>
                <div id="lightning_button_div">
                  <label for="local">USA</label>
                  <input type="radio" class="lightning_button" id="local" name="lightningmode" onclick="set_lightning_mode(this.value); document.getElementById('lightning_slider').hidden = true" value="1" checked>
                  <label for="usa">Local</label>
                  <input type="radio" class="lightning_button" id="usa" name="lightningmode" onclick="set_lightning_mode(this.value); document.getElementById('lightning_slider').hidden = false" value="2">
                </div>
                <div id="lightning_slider_div">
                  <input id="lightning_slider" type="range" min="0" max="8" step="1" value="6" orient="vertical" hidden>
                </div>
              </div>
            </div>
            <div class="command-mode-item">
              <button id="FINANCE" class="mode_button" onclick="set_mode(this.id); get_tickers();">Finance 🤑</button>
              <div id="finance_div" hidden>
                <input type="text" id="ticker" autocomplete="off" oninput="get_possible_autofill_tickers(this.value)"></input>
              </div>
            </div>
          </div>
        </section>

        <section class="command-group-panel">
          <div class="command-group-header">Fun</div>
          <div class="command-group-grid">
            <div class="command-mode-item">
              <button id="CUSTOM_MESSAGE" class="mode_button" onclick="set_mode(this.id); document.getElementById('custom_message_div').hidden = false">Custom Message</button>
              <div id="custom_message_div" hidden>
                <div id="custom_message_buttons">
                  <button class="custom_colors_button" onclick="set_color_mode(0)">Plain</button>
                  <button class="custom_colors_button" onclick="set_color_mode(1)">🌈</button>
                  <button class="custom_colors_button" onclick="set_color_mode(2)">🎄</button>
                  <button class="custom_colors_button" onclick="set_color_mode(3)"><span style="color: rgb(173, 0, 30)">U</span><span style="color: rgb(108, 108, 108)">S</span><span style="color: rgb(37, 120, 178)">A</span></button>
                  <button class="custom_colors_button" onclick="set_color_mode(4)">🎃</button>
                  <input type="color" id="colorpicker" oninput="set_color_mode(6+parseInt(document.getElementById('colorpicker').value.substring(1), 16))" value="#ff0000" style="height: 30px;">
                  <button class="custom_colors_button" onclick="set_color_mode(5)">💿</button>
                </div>
                <br>
                <input type="text" id="custom_message"></input>
              </div>
            </div>
            <div class="command-mode-item">
              <button id="COUNTDOWN" class="mode_button" onclick="set_mode(this.id); document.getElementById('countdown_div').hidden = false">Countdown</button>
              <div id="countdown_div" hidden>
                <div id="countdown_buttons">
                  <button class="custom_colors_button" onclick="set_color_mode(0)">Plain</button>
                  <button class="custom_colors_button" onclick="set_color_mode(1)">🌈</button>
                  <button class="custom_colors_button" onclick="set_color_mode(2)">🎄</button>
                  <button class="custom_colors_button" onclick="set_color_mode(3)"><span style="color: rgb(173, 0, 30)">U</span><span style="color: rgb(108, 108, 108)">S</span><span style="color: rgb(37, 120, 178)">A</span></button>
                  <button class="custom_colors_button" onclick="set_color_mode(4)">🎃</button>
                  <input type="color" id="colorpicker2" oninput="set_color_mode(6+parseInt(document.getElementById('colorpicker2').value.substring(1), 16))" value="#ff0000" style="height: 30px;">
                </div>
                <br>
                <input type="text" id="countdown_message"></input>
                <br>
                <input type="datetime-local" id="setdatetime" name="setdatetime">
                <input type="submit" onclick="set_countdown(document.getElementById('setdatetime').value,'a'+document.getElementById('countdown_message').value)" value="Submit">
              </div>
            </div>
            <div class="command-mode-item">
              <button id="WELCOME" class="mode_button" onclick="set_mode(this.id)">Welcome Intro</button>
            </div>
            <div class="command-mode-item">
              <button id="CGOL" class="mode_button" onclick="set_mode(this.id); document.getElementById('cgol_div').hidden = false">CGOL</button>
              <div id="cgol_div" hidden>
                <input type="radio" id="rainbowgol" name="cgolstyle" onclick="set_mode('CGOL')" value="1" checked="checked">
                <label for="rainbowgol">Rainbow Rules</label>
                <input type="radio" id="colorshift" name="cgolstyle" onclick="set_mode('CGOL')" value="2">
                <label for="colorshift">Color Shifting</label>
              </div>
            </div>
            <div class="command-mode-item">
              <button id="MANDELBROT" class="mode_button" onclick="set_mode(this.id); document.getElementById('mandelbrot_div').hidden = false">Mandelbrot</button>
              <div id="mandelbrot_div" hidden>
                <label for="colormap">Colormap:</label>
                <select name="colormap" id="colormap" onchange="set_mandelbrot_color(this.value);">
                  <option value="0">Rainbow</option>
                  <option value="1">Sunset</option>
                  <option value="2">Nova</option>
                  <option value="3">Vaporwave</option>
                  <option value="4">70's</option>
                  <option value="5">Pastel</option>
                  <option value="6">Neon</option>
                  <option value="7">Elemental</option>
                  <option value="8">Fire</option>
                  <option value="9">Greyscale</option>
                </select>
                <br>
                <input id="mandelbrot_slider" type="range" min="0.1" max="3" step="0.1" value="3">
              </div>
            </div>
            <div class="command-mode-item">
              <button id="PONG" class="mode_button" onclick="set_mode(this.id); document.getElementById('pong_div').hidden = false">PONG!</button>
              <div id="pong_div" hidden>
                <input class="pong_slider" id="pong_player1_slider" type="range" min="0" max="26" step="1" value="0">
                <input class="pong_slider" id="pong_player2_slider" type="range" min="0" max="26" step="1" value="0">
              </div>
            </div>
            <div class="command-mode-item">
              <button id="CCA" class="mode_button" onclick="set_mode(this.id)">CCA</button>
            </div>
            <div class="command-mode-item">
              <button id="AQUARIUM" class="mode_button" onclick="set_mode(this.id)">Aquarium</button>
            </div>
            <div class="command-mode-item">
              <button id="FIREWORKS" class="mode_button" onclick="set_mode(this.id)">Fireworks</button>
            </div>
            <div class="command-mode-item">
              <button id="FREE_SKETCH" class="mode_button" onclick="set_mode(this.id); open_free_sketch_modal()">Free Sketch</button>
            </div>
            <div class="command-mode-item">
              <button id="SANTA" class="mode_button" onclick="set_mode(this.id)">Christmas</button>
            </div>
            <div class="command-mode-item">
              <button id="SNOWFALL" class="mode_button" onclick="set_mode(this.id)">Let It Snow!</button>
            </div>
          </div>
        </section>
      </section>

      <aside class="command-right-column">
        <section class="command-right-panel command-right-panel-info">
          <div class="device_info_box box6">
            <div class="device_info_header">Device Info</div>
            <div id="device_info_content" class="device_info_content">
              <div class="device_info_row">
                <span class="device_info_label">Hostname</span>
                <span class="device_info_value" id="di_hostname">—</span>
              </div>
              <div class="device_info_row">
                <span class="device_info_label">IP Address</span>
                <span class="device_info_value" id="di_ip">—</span>
              </div>
              <div class="device_info_row">
                <span class="device_info_label">CPU Temp</span>
                <span class="device_info_value" id="di_cpu_temp">—</span>
              </div>
              <div class="device_info_row">
                <span class="device_info_label">Disk Usage</span>
                <span class="device_info_value" id="di_disk">—</span>
              </div>
              <div class="device_info_row">
                <span class="device_info_label">Memory</span>
                <span class="device_info_value" id="di_mem">—</span>
              </div>
              <div class="device_info_row">
                <span class="device_info_label">Uptime</span>
                <span class="device_info_value" id="di_uptime">—</span>
              </div>
            </div>
          </div>
        </section>

        <section class="command-right-panel command-right-panel-audio">
          <div class="command-side-header">Audio &amp; Input</div>
          <div class="command-audio-stack">
            <div id="mic_button" class="box4" hidden>
              <div class="record_button_object">
                <div class="record_button_outline">
                </div>
                <div class="record_button_outline" id="delayed">
                </div>
                <div class="button">
                </div>
                <div class="button" id="circlein">
                  <svg id="mic-icon" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 1000 1000" enable-background="new 0 0 1000 1000" xml:space="preserve">
                    <g>
                      <path d="M500,683.8c84.6,0,153.1-68.6,153.1-153.1V163.1C653.1,78.6,584.6,10,500,10c-84.6,0-153.1,68.6-153.1,153.1v367.5C346.9,615.2,415.4,683.8,500,683.8z M714.4,438.8v91.9C714.4,649,618.4,745,500,745c-118.4,0-214.4-96-214.4-214.4v-91.9h-61.3v91.9c0,141.9,107.2,258.7,245,273.9v124.2H346.9V990h306.3v-61.3H530.6V804.5c137.8-15.2,245-132.1,245-273.9v-91.9H714.4z" />
                    </g>
                  </svg>
                </div>
              </div>
              <audio id="audio"></audio>
            </div>
            <div id="sounds_div" class="box5" hidden>
              <select name="sounds" id="sound-list">
              </select>
              <button class="a_sound_button" onclick="play_selected_sound();">🎺</button>
            </div>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <div class="sidenav" style="display:none" id="optionsSidebar">
    <button onclick="hide_options()" class="closebutton">&times;</button>
    <span id="linetemplate" class="configline" style="display:none">
      <label for="templatename" class="configline"></label><input type="text" class="configline" id="templateid" name="templatename" value="">
    </span>
    <button id="geolocate_button" type="button" onclick="fill_location_from_browser()" style="display:none;">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
      </svg>
      Use My Location
    </button>
    <form id="config" name="config" method="get">
      <span id="config_button_span">
        <button id="submit_config_button" type="submit" class="configline">Update Config</button>
      </span>
    </form>
  </div>

  <div id="free_sketch_modal" class="modal_backdrop" hidden aria-hidden="true">
    <div class="free_sketch_modal" role="dialog" aria-modal="true" aria-labelledby="free_sketch_title">
      <div class="free_sketch_header">
        <h2 id="free_sketch_title">Free Sketch</h2>
        <div class="free_sketch_header_actions">
          <button type="button" id="free_sketch_fullscreen_toggle" class="free_sketch_control_button" onclick="toggle_free_sketch_fullscreen()" aria-pressed="false">Full Screen</button>
          <button type="button" class="free_sketch_icon_button" onclick="close_free_sketch_modal()" aria-label="Close">&times;</button>
        </div>
      </div>
      <div class="free_sketch_canvas_wrap">
        <canvas id="free_sketch_canvas" width="128" height="32"></canvas>
        <canvas id="free_sketch_hover_canvas" width="128" height="32" aria-hidden="true"></canvas>
      </div>
      <div class="free_sketch_controls">
        <!-- Color Palette Section -->
        <div class="free_sketch_color_section">
          <div class="free_sketch_color_palette">
            <button type="button" class="free_sketch_color_swatch" style="background-color: #ff0000;" onclick="set_free_sketch_color('#ff0000')" aria-label="Red" title="Red"></button>
            <button type="button" class="free_sketch_color_swatch" style="background-color: #ff7f00;" onclick="set_free_sketch_color('#ff7f00')" aria-label="Orange" title="Orange"></button>
            <button type="button" class="free_sketch_color_swatch" style="background-color: #ffff00;" onclick="set_free_sketch_color('#ffff00')" aria-label="Yellow" title="Yellow"></button>
            <button type="button" class="free_sketch_color_swatch" style="background-color: #00ff00;" onclick="set_free_sketch_color('#00ff00')" aria-label="Green" title="Green"></button>
            <button type="button" class="free_sketch_color_swatch" style="background-color: #0000ff;" onclick="set_free_sketch_color('#0000ff')" aria-label="Blue" title="Blue"></button>
            <button type="button" class="free_sketch_color_swatch" style="background-color: #8b00ff;" onclick="set_free_sketch_color('#8b00ff')" aria-label="Purple" title="Purple"></button>
            <button type="button" class="free_sketch_color_swatch" style="background-color: #ff00ff;" onclick="set_free_sketch_color('#ff00ff')" aria-label="Magenta" title="Magenta"></button>
            <button type="button" class="free_sketch_color_swatch" style="background-color: #ffffff;" onclick="set_free_sketch_color('#ffffff')" aria-label="White" title="White"></button>
            <button type="button" class="free_sketch_color_swatch" style="background-color: #7f7f7f;" onclick="set_free_sketch_color('#7f7f7f')" aria-label="Gray" title="Gray"></button>
            <button type="button" class="free_sketch_color_swatch" style="background-color: #000000;" onclick="set_free_sketch_color('#000000')" aria-label="Black" title="Black"></button>
          </div>
          <div class="free_sketch_color_controls">
            <label class="free_sketch_color_label" for="free_sketch_color">Custom:</label>
            <input type="color" id="free_sketch_color" value="#ff0000">
          </div>
          <div id="free_sketch_recent_colors" class="free_sketch_recent_colors" aria-label="Recent colors"></div>
        </div>

        <!-- Brush Sizes -->
        <div class="free_sketch_brush_sizes" role="group" aria-label="Brush size">
          <button type="button" id="free_sketch_brush_1" class="free_sketch_brush_size active" onclick="set_free_sketch_brush_size(1)" aria-pressed="true">1</button>
          <button type="button" id="free_sketch_brush_2" class="free_sketch_brush_size" onclick="set_free_sketch_brush_size(2)" aria-pressed="false">2</button>
          <button type="button" id="free_sketch_brush_3" class="free_sketch_brush_size" onclick="set_free_sketch_brush_size(3)" aria-pressed="false">3</button>
          <button type="button" id="free_sketch_brush_4" class="free_sketch_brush_size" onclick="set_free_sketch_brush_size(4)" aria-pressed="false">4</button>
          <button type="button" id="free_sketch_brush_5" class="free_sketch_brush_size" onclick="set_free_sketch_brush_size(5)" aria-pressed="false">5</button>
        </div>

        <!-- Brush Shapes -->
        <div class="free_sketch_brush_shapes" role="group" aria-label="Brush shape">
          <button type="button" id="free_sketch_brush_shape_square" class="free_sketch_brush_shape active" onclick="set_free_sketch_brush_shape('square')" aria-pressed="true" title="Square">
            <svg viewBox="0 0 20 20" width="20" height="20">
              <rect x="4" y="4" width="12" height="12" fill="currentColor" />
            </svg>
          </button>
          <button type="button" id="free_sketch_brush_shape_circle" class="free_sketch_brush_shape" onclick="set_free_sketch_brush_shape('circle')" aria-pressed="false" title="Circle">
            <svg viewBox="0 0 20 20" width="20" height="20">
              <circle cx="10" cy="10" r="6" fill="currentColor" />
            </svg>
          </button>
          <button type="button" id="free_sketch_brush_shape_plus" class="free_sketch_brush_shape" onclick="set_free_sketch_brush_shape('plus')" aria-pressed="false" title="Plus">
            <svg viewBox="0 0 20 20" width="20" height="20">
              <path d="M9 5h2v10H9z M5 9h10v2H5z" fill="currentColor" />
            </svg>
          </button>
          <button type="button" id="free_sketch_brush_shape_x" class="free_sketch_brush_shape" onclick="set_free_sketch_brush_shape('x')" aria-pressed="false" title="X">
            <svg viewBox="0 0 20 20" width="20" height="20">
              <path d="M6.5 5.086l7.414 7.414-1.414 1.414L5.086 6.5z M13.914 5.086l1.414 1.414-7.414 7.414-1.414-1.414z" fill="currentColor" />
            </svg>
          </button>
        </div>

        <!-- Tools -->
        <button type="button" id="free_sketch_eraser" class="free_sketch_control_button" onclick="toggle_free_sketch_eraser()">Eraser</button>
        <button type="button" id="free_sketch_color_picker" class="free_sketch_control_button" onclick="toggle_free_sketch_color_picker()">Pick Color</button>
        <button type="button" id="free_sketch_paint_bucket" class="free_sketch_control_button" onclick="toggle_free_sketch_paint_bucket()">Fill</button>
        <button type="button" id="free_sketch_stamp" class="free_sketch_control_button free_sketch_stamp_button" onclick="toggle_free_sketch_stamp()">&#10052;</button>
        <button type="button" id="free_sketch_undo" class="free_sketch_control_button" onclick="undo_free_sketch()" disabled>Undo</button>
        <button type="button" class="free_sketch_control_button" onclick="clear_free_sketch()">Clear</button>
        <button type="button" class="free_sketch_control_button" onclick="save_free_sketch()">Save</button>
      </div>
      <div id="free_sketch_gallery" class="free_sketch_gallery"></div>
    </div>
  </div>

  <div id="version" style="position: fixed; bottom: 5px; right: 5px; color: grey; font-size: 12px;">
    v???
  </div>
</body>

</html>
