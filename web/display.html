<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlaneSign Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #888;
        }

        #display-container {
            position: relative;
            background: #000;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        #matrix {
            display: block;
            width: 1024px;
            height: 256px;
            border: 2px solid #222;
        }

        #status {
            margin-top: 12px;
            font-size: 12px;
            text-align: center;
        }

        #status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .connected #status-dot {
            background: #0f0;
        }

        .disconnected #status-dot {
            background: #f00;
        }

        .connecting #status-dot {
            background: #ff0;
        }

        #fps {
            margin-top: 4px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>

<body>
    <div id="display-container">
        <canvas id="matrix" width="1024" height="256"></canvas>
    </div>
    <div id="status" class="disconnected">
        <span id="status-dot"></span>
        <span id="status-text">Disconnected</span>
    </div>
    <div id="fps"></div>

    <script>
        const MATRIX_WIDTH = 128;
        const MATRIX_HEIGHT = 32;
        const FRAME_BYTES = MATRIX_WIDTH * MATRIX_HEIGHT * 4; // RGBA

        const SCALE = 8;        // each source pixel = 8x8 display pixels
        const GRID_GAP = 1;     // 1px grid line between pixels
        const CELL = SCALE - GRID_GAP; // 7x7 filled area per pixel

        const DISPLAY_WIDTH = MATRIX_WIDTH * SCALE;   // 1024
        const DISPLAY_HEIGHT = MATRIX_HEIGHT * SCALE;  // 256

        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const fpsEl = document.getElementById('fps');

        // Pre-allocate display ImageData and typed array views
        const displayImageData = ctx.createImageData(DISPLAY_WIDTH, DISPLAY_HEIGHT);
        const displayBuf = new ArrayBuffer(DISPLAY_WIDTH * DISPLAY_HEIGHT * 4);
        const displayU32 = new Uint32Array(displayBuf);
        const displayU8 = new Uint8ClampedArray(displayBuf);

        // Grid line color as ABGR uint32 (little-endian: 0xAA_BB_GG_RR)
        const GRID_COLOR = 0xFF303030;  // #303030 fully opaque

        // Fill canvas with grid color initially
        displayU32.fill(GRID_COLOR);
        displayImageData.data.set(displayU8);
        ctx.putImageData(displayImageData, 0, 0);

        let ws = null;
        let reconnectDelay = 500;
        const MAX_RECONNECT_DELAY = 5000;

        // FPS tracking
        let frameCount = 0;
        let lastFpsTime = performance.now();

        function updateFps() {
            const now = performance.now();
            const elapsed = now - lastFpsTime;
            if (elapsed >= 1000) {
                const fps = (frameCount * 1000 / elapsed).toFixed(1);
                fpsEl.textContent = `${fps} fps`;
                frameCount = 0;
                lastFpsTime = now;
            }
        }

        function renderFrame(frameData) {
            // Fill entire display buffer with grid color
            displayU32.fill(GRID_COLOR);

            // For each source pixel, fill a CELL×CELL block at the correct position
            for (let sy = 0; sy < MATRIX_HEIGHT; sy++) {
                const baseY = sy * SCALE;
                for (let sx = 0; sx < MATRIX_WIDTH; sx++) {
                    const srcIdx = (sy * MATRIX_WIDTH + sx) * 4;
                    const r = frameData[srcIdx];
                    const g = frameData[srcIdx + 1];
                    const b = frameData[srcIdx + 2];
                    // Pack as ABGR uint32 (little-endian)
                    const color = 0xFF000000 | (b << 16) | (g << 8) | r;

                    const baseX = sx * SCALE;
                    for (let dy = 0; dy < CELL; dy++) {
                        const rowOffset = (baseY + dy) * DISPLAY_WIDTH + baseX;
                        for (let dx = 0; dx < CELL; dx++) {
                            displayU32[rowOffset + dx] = color;
                        }
                    }
                }
            }

            displayImageData.data.set(displayU8);
            ctx.putImageData(displayImageData, 0, 0);
        }

        function setStatus(state, message) {
            statusEl.className = state;
            statusText.textContent = message;
        }

        function connect() {
            const wsUrl = `ws://${window.location.hostname}:5001`;
            setStatus('connecting', `Connecting to ${wsUrl}...`);

            ws = new WebSocket(wsUrl);
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                setStatus('connected', 'Connected');
                reconnectDelay = 500;
            };

            ws.onmessage = (event) => {
                if (event.data.byteLength !== FRAME_BYTES) return;

                renderFrame(new Uint8Array(event.data));

                frameCount++;
                updateFps();
            };

            ws.onclose = () => {
                setStatus('disconnected', `Disconnected — reconnecting in ${reconnectDelay}ms...`);
                fpsEl.textContent = '';
                setTimeout(() => {
                    reconnectDelay = Math.min(reconnectDelay * 1.5, MAX_RECONNECT_DELAY);
                    connect();
                }, reconnectDelay);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        connect();
    </script>
</body>

</html>
