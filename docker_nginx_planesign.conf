server {

        listen 80 default_server;
        listen 443 ssl default_server;

        root ${PLANESIGN_ROOT}/web;

        index index.html;

        server_name _;

        ssl_certificate /etc/ssl/certs/planesign-selfsigned.crt;
        ssl_certificate_key /etc/ssl/private/planesign-selfsigned.key;

        location / {
                add_header 'Access-Control-Allow-Origin' '*';
                try_files $uri $uri.html $uri/ =404;
        }

        location /api/ {
                rewrite /api/(.*) /$1  break;
                # Must be 127.0.0.1, not localhost: localhost also resolves to ::1 and nginx would
                # round-robin between them. The API server only listens on IPv4.
                proxy_pass         http://127.0.0.1:5055;
                proxy_redirect     off;
                proxy_set_header   Host $host;
        }

}